<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Agenda">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<title>Agenda</title>
<style>
:root{--bg:#f2f2f7;--card:#fff;--text:#1c1c1e;--mute:#8e8e93;--line:#e5e5ea;--accent:#007aff;--red:#ff3b30}
@media(prefers-color-scheme:dark){:root{--bg:#000;--card:#1c1c1e;--text:#f2f2f7;--mute:#98989f;--line:#2c2c2e}}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
[hidden]{display:none!important}
html,body{margin:0;height:100%;background:var(--bg);color:var(--text);font:15px/1.35 -apple-system,BlinkMacSystemFont,"SF Pro Text",system-ui,sans-serif}
#app{height:100%;display:flex;flex-direction:column;padding:env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left)}
header{display:flex;align-items:center;gap:10px 12px;padding:10px 14px;flex-wrap:wrap}
h1{font-size:22px;margin:0;flex:1;min-width:170px;font-weight:700;text-transform:capitalize;white-space:nowrap}
.nav{display:flex;gap:6px}
button{font:inherit;color:inherit;cursor:pointer}
.btn{border:0;background:var(--card);border-radius:10px;padding:7px 13px;font-weight:600;color:var(--accent);min-height:36px}
.seg{display:flex;background:var(--line);border-radius:10px;padding:2px}
.seg button{border:0;background:transparent;padding:6px 12px;border-radius:8px;font-weight:600;min-height:32px}
.seg button.on{background:var(--card);box-shadow:0 1px 3px rgba(0,0,0,.15)}
.pal{display:flex;gap:7px;align-items:center;background:var(--card);padding:6px 10px;border-radius:20px}
.pal button{width:22px;height:22px;border-radius:50%;border:0;padding:0;background:var(--c);box-shadow:0 0 0 0 var(--c)}
.pal button.on{box-shadow:0 0 0 2px var(--card),0 0 0 4px var(--c)}
main{flex:1;overflow:auto;padding:0 12px 14px;-webkit-overflow-scrolling:touch}
/* week */
.week{display:grid;grid-template-columns:repeat(4,1fr);grid-auto-rows:minmax(230px,1fr);gap:10px;min-height:100%}
@media(max-width:700px){.week{grid-template-columns:repeat(2,1fr)}}
.cell{background:var(--card);border-radius:14px;padding:10px;display:flex;flex-direction:column;min-height:0;overflow:hidden}
.cell .list{flex:1;overflow-y:auto;min-height:0}
.dh{display:flex;justify-content:space-between;align-items:center;font-weight:600;margin-bottom:4px}
.dn{color:var(--mute);font-size:13px;text-transform:uppercase;letter-spacing:.03em}
.dd{font-size:18px;min-width:30px;height:30px;line-height:30px;text-align:center;border-radius:15px}
.today .dd{background:var(--red);color:#fff}
.today .dn{color:var(--red)}
.box{background:color-mix(in srgb,var(--accent) 7%,var(--card))}
.box .dn{color:var(--accent)}
/* tasks */
.task{display:flex;gap:8px;align-items:flex-start;padding:6px 8px;margin:4px 0;border-radius:8px;background:color-mix(in srgb,var(--c) 17%,var(--card));border-left:4px solid var(--c);touch-action:pan-y;-webkit-user-select:none;user-select:none;-webkit-touch-callout:none}
.task .tx{flex:1;word-break:break-word}
.chk{flex:none;width:20px;height:20px;border-radius:50%;border:2px solid var(--c);background:transparent;padding:0;margin-top:1px;color:#fff;font-size:12px;line-height:16px;font-weight:700}
.done .chk{background:var(--c)}
.done .chk::after{content:"✓"}
.done .tx{text-decoration:line-through;opacity:.5}
.add{border:0;background:transparent;width:100%;padding:8px 4px;color:var(--text);font:inherit;outline:none;border-top:1px solid var(--line);margin-top:4px;flex:none}
.add::placeholder{color:var(--mute)}
.pill{display:block;padding:1px 5px;margin:2px 0;font-size:11.5px;border-radius:5px;border-left-width:3px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.pill .chk{display:none}
.pill .tx{display:block;overflow:hidden;text-overflow:ellipsis}
.more{font-size:11px;color:var(--mute);padding-left:4px}
/* month */
.monthwrap{display:grid;grid-template-columns:1fr 280px;gap:10px;min-height:100%}
@media(max-width:820px){.monthwrap{grid-template-columns:1fr}.monthwrap .box{min-height:200px}}
.mcal{display:flex;flex-direction:column;background:var(--card);border-radius:14px;overflow:hidden;min-height:480px}
.wd{display:grid;grid-template-columns:repeat(7,1fr);text-align:center;padding:8px 0;color:var(--mute);font-size:12px;font-weight:600;text-transform:uppercase}
.mgrid{flex:1;display:grid;grid-template-columns:repeat(7,1fr);gap:1px;background:var(--line);border-top:1px solid var(--line)}
.mc{background:var(--card);padding:4px;min-width:0;overflow:hidden}
.mc.other{opacity:.4}
.mn{display:inline-block;font-size:13px;font-weight:600;min-width:22px;height:22px;line-height:22px;text-align:center;border-radius:11px}
.mc.today .mn{background:var(--red);color:#fff}
/* multi */
.multi{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.multi.n12{grid-template-columns:repeat(4,1fr)}
@media(max-width:900px){.multi,.multi.n12{grid-template-columns:repeat(2,1fr)}}
@media(max-width:560px){.multi,.multi.n12{grid-template-columns:1fr}}
.mm{background:var(--card);border-radius:14px;padding:10px;display:flex;flex-direction:column;gap:6px}
.mtitle{margin:0;font-size:16px;text-transform:capitalize;color:var(--accent);cursor:pointer}
.mini{display:grid;grid-template-columns:repeat(7,1fr);gap:2px;text-align:center}
.mini .h{font-size:10px;color:var(--mute);font-weight:600}
.md{border:0;background:transparent;padding:3px 0 2px;border-radius:8px;display:flex;flex-direction:column;align-items:center;min-height:34px;font-size:13px}
.md.today b{background:var(--red);color:#fff;border-radius:50%;width:20px;height:20px;line-height:20px}
.md b{font-weight:500;width:20px;height:20px;line-height:20px}
.dots{display:flex;gap:2px;height:5px;margin-top:2px}
.dot{width:5px;height:5px;border-radius:50%}
.box2{background:color-mix(in srgb,var(--accent) 7%,var(--card));border-radius:10px;padding:8px;display:flex;flex-direction:column;min-height:130px}
.box2 .bh{font-size:12px;font-weight:600;color:var(--accent);text-transform:uppercase}
/* drag */
.ghost{position:fixed;z-index:100;pointer-events:none;opacity:.92;box-shadow:0 8px 24px rgba(0,0,0,.3);transform:scale(1.04);margin:0}
.dragging{opacity:.3}
[data-drop].over{outline:2px dashed var(--accent);outline-offset:-2px}
/* modal */
.ov{position:fixed;inset:0;background:rgba(0,0,0,.4);display:flex;align-items:center;justify-content:center;z-index:50;padding:16px}
.sheet{background:var(--card);border-radius:18px;width:min(440px,100%);padding:16px;display:flex;flex-direction:column;gap:12px;box-shadow:0 10px 40px rgba(0,0,0,.35)}
.sheet textarea,.sheet input[type=date]{width:100%;font:inherit;color:var(--text);background:var(--bg);border:0;border-radius:10px;padding:10px;outline:none;resize:none}
.sheet .colors{display:flex;gap:12px;flex-wrap:wrap}
.sheet .colors button{width:30px;height:30px;border-radius:50%;border:0;background:var(--c)}
.sheet .colors button.on{box-shadow:0 0 0 2px var(--card),0 0 0 4px var(--c)}
.sheet .seg{width:100%}.sheet .seg button{flex:1}
.sheet .row{display:flex;gap:8px;align-items:center}
.sheet .row .sp{flex:1}
.sheet .del{color:var(--red)}
.sheet .pri{background:var(--accent);color:#fff}
.sheet label{display:flex;gap:8px;align-items:center}
.sheet label input{width:20px;height:20px}
.menu button{width:100%;text-align:left;margin:0}
</style>
</head>
<body>
<div id="app">
<header>
  <div class="nav"><button class="btn" id="prev" aria-label="Indietro">‹</button><button class="btn" id="today">Oggi</button><button class="btn" id="next" aria-label="Avanti">›</button></div>
  <h1 id="title"></h1>
  <div class="seg" id="multis" hidden><button data-n="3">3 mesi</button><button data-n="6">6 mesi</button><button data-n="12">12 mesi</button></div>
  <div class="seg" id="views"><button data-v="week">Settimana</button><button data-v="month">Mese</button><button data-v="multi">Mesi</button></div>
  <div class="pal" id="pal" title="Colore per le nuove attività"></div>
  <button class="btn" id="menu" aria-label="Menu">⋯</button>
</header>
<main id="main"></main>
</div>
<input type="file" id="file" accept="application/json,.json" hidden>
<script>
const $=s=>document.querySelector(s);
const COLORS=['#ff3b30','#ff9500','#ffcc00','#34c759','#32ade6','#007aff','#af52de','#8e8e93'];
const CN=['Rosso','Arancio','Giallo','Verde','Azzurro','Blu','Viola','Grigio'];
const DAYS=['Lunedì','Martedì','Mercoledì','Giovedì','Venerdì','Sabato','Domenica'];
const WD=['Lun','Mar','Mer','Gio','Ven','Sab','Dom'];
const pad=n=>String(n).padStart(2,'0');
const fmt=d=>d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate());
const parse=s=>{const [y,m,d]=s.split('-').map(Number);return new Date(y,m-1,d||1)};
const addDays=(d,n)=>{const x=new Date(d);x.setDate(x.getDate()+n);return x};
const monday=d=>{const x=new Date(d);x.setHours(0,0,0,0);x.setDate(x.getDate()-((x.getDay()+6)%7));return x};
const esc=s=>s.replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const keyFor=(s,ds)=>s==='day'?ds:s==='week'?fmt(monday(parse(ds))):ds.slice(0,7);
const uid=()=>Date.now().toString(36)+Math.random().toString(36).slice(2,6);
const KEY='agenda-v1';
let S={tasks:[],view:'week',color:5,multi:3};
try{const r=localStorage.getItem(KEY);if(r)Object.assign(S,JSON.parse(r))}catch(e){}
S.cursor=fmt(new Date());
function save(){
  try{localStorage.setItem(KEY,JSON.stringify({tasks:S.tasks,view:S.view,color:S.color,multi:S.multi}))}catch(e){}
}
try{if(navigator.storage&&navigator.storage.persist)navigator.storage.persist()}catch(e){}
const mlong=d=>d.toLocaleDateString('it-IT',{month:'long',year:'numeric'});

function taskHTML(t,compact){
  return `<div class="task${t.done?' done':''}${compact?' pill':''}" data-id="${t.id}" style="--c:${COLORS[t.c]}"><button class="chk" data-chk="${t.id}" aria-label="Fatto"></button><span class="tx">${esc(t.t)}</span></div>`;
}
function listHTML(s,k,compact,max){
  const a=S.tasks.filter(t=>t.s===s&&t.k===k);
  let h=a.slice(0,max||9999).map(t=>taskHTML(t,compact)).join('');
  if(max&&a.length>max)h+=`<div class="more">+${a.length-max} altre</div>`;
  return h;
}
const addInput=(s,k)=>`<input class="add" data-s="${s}" data-k="${k}" placeholder="＋ Aggiungi" enterkeyhint="done" autocomplete="off">`;

function weekTitle(m){
  const e=addDays(m,6);
  const sh=d=>d.toLocaleDateString('it-IT',{month:'short'});
  if(m.getMonth()===e.getMonth())return `${m.getDate()} – ${e.getDate()} ${m.toLocaleDateString('it-IT',{month:'long'})} ${e.getFullYear()}`;
  return `${m.getDate()} ${sh(m)} – ${e.getDate()} ${sh(e)} ${e.getFullYear()}`;
}
function dayCell(d,i){
  const ds=fmt(d),t=ds===fmt(new Date());
  return `<section class="cell${t?' today':''}" data-drop data-s="day" data-k="${ds}"><div class="dh"><span class="dn">${DAYS[i]}</span><span class="dd">${d.getDate()}</span></div><div class="list">${listHTML('day',ds)}</div>${addInput('day',ds)}</section>`;
}
function weekView(){
  const m=monday(parse(S.cursor));
  $('#title').textContent=weekTitle(m);
  let h='<div class="week">';
  for(let i=0;i<7;i++)h+=dayCell(addDays(m,i),i);
  const wk=fmt(m);
  h+=`<section class="cell box" data-drop data-s="week" data-k="${wk}"><div class="dh"><span class="dn">Attività della settimana</span></div><div class="list">${listHTML('week',wk)}</div>${addInput('week',wk)}</section></div>`;
  return h;
}
function monthBox(mk,cls,title){
  return `<section class="${cls}" data-drop data-s="month" data-k="${mk}"><div class="${cls==='cell box'?'dh':'bh'}"><span class="${cls==='cell box'?'dn':''}">${title}</span></div><div class="list" style="flex:1;overflow-y:auto">${listHTML('month',mk)}</div>${addInput('month',mk)}</section>`;
}
function monthView(){
  const f=parse(S.cursor.slice(0,7)+'-01'),y=f.getFullYear(),mo=f.getMonth();
  $('#title').textContent=mlong(f);
  const off=(f.getDay()+6)%7,dim=new Date(y,mo+1,0).getDate(),rows=Math.ceil((off+dim)/7),start=addDays(f,-off),ts=fmt(new Date());
  let cells='';
  for(let i=0;i<rows*7;i++){
    const d=addDays(start,i),ds=fmt(d);
    cells+=`<div class="mc${d.getMonth()!==mo?' other':''}${ds===ts?' today':''}" data-drop data-s="day" data-k="${ds}" data-new="${ds}"><span class="mn">${d.getDate()}</span>${listHTML('day',ds,true,3)}</div>`;
  }
  return `<div class="monthwrap"><div class="mcal"><div class="wd">${WD.map(x=>`<span>${x}</span>`).join('')}</div><div class="mgrid" style="grid-template-rows:repeat(${rows},minmax(84px,1fr))">${cells}</div></div>${monthBox(S.cursor.slice(0,7),'cell box','Attività del mese')}</div>`;
}
function miniHTML(y,mo){
  const f=new Date(y,mo,1),off=(f.getDay()+6)%7,dim=new Date(y,mo+1,0).getDate(),ts=fmt(new Date());
  let h=WD.map(x=>`<span class="h">${x[0]}</span>`).join('');
  for(let i=0;i<off;i++)h+='<span></span>';
  for(let n=1;n<=dim;n++){
    const ds=fmt(new Date(y,mo,n));
    const cols=[...new Set(S.tasks.filter(t=>t.s==='day'&&t.k===ds).map(t=>t.c))].slice(0,3);
    h+=`<button class="md${ds===ts?' today':''}" data-go="${ds}" data-drop data-s="day" data-k="${ds}"><b>${n}</b><span class="dots">${cols.map(c=>`<i class="dot" style="background:${COLORS[c]}"></i>`).join('')}</span></button>`;
  }
  return h;
}
function multiView(){
  const f=parse(S.cursor.slice(0,7)+'-01');
  const last=new Date(f.getFullYear(),f.getMonth()+S.multi-1,1);
  const sh=d=>d.toLocaleDateString('it-IT',{month:'short',year:'numeric'});
  $('#title').textContent=sh(f)+' – '+sh(last);
  let h=`<div class="multi n${S.multi}">`;
  for(let i=0;i<S.multi;i++){
    const d=new Date(f.getFullYear(),f.getMonth()+i,1),mk=fmt(d).slice(0,7);
    h+=`<article class="mm"><h3 class="mtitle" data-gomonth="${mk}">${mlong(d)}</h3><div class="mini">${miniHTML(d.getFullYear(),d.getMonth())}</div>${monthBox(mk,'box2','Attività del mese')}</article>`;
  }
  return h+'</div>';
}
function render(){
  const main=$('#main'),sc=main.scrollTop;
  document.querySelectorAll('#views button').forEach(b=>b.classList.toggle('on',b.dataset.v===S.view));
  $('#multis').hidden=S.view!=='multi';
  document.querySelectorAll('#multis button').forEach(b=>b.classList.toggle('on',+b.dataset.n===S.multi));
  document.querySelectorAll('#pal button').forEach((b,i)=>b.classList.toggle('on',i===S.color));
  main.innerHTML=S.view==='week'?weekView():S.view==='month'?monthView():multiView();
  main.scrollTop=sc;
}
function shift(dir){
  const c=parse(S.cursor);
  if(S.view==='week')c.setDate(c.getDate()+7*dir);
  else{c.setDate(1);c.setMonth(c.getMonth()+(S.view==='month'?dir:dir*S.multi))}
  S.cursor=fmt(c);render();
}

/* ---- nav / header ---- */
$('#prev').onclick=()=>shift(-1);
$('#next').onclick=()=>shift(1);
$('#today').onclick=()=>{S.cursor=fmt(new Date());render()};
$('#views').onclick=e=>{const b=e.target.closest('button');if(!b)return;S.view=b.dataset.v;save();render()};
$('#multis').onclick=e=>{const b=e.target.closest('button');if(!b)return;S.multi=+b.dataset.n;save();render()};
$('#pal').innerHTML=COLORS.map((c,i)=>`<button style="--c:${c}" data-c="${i}" title="${CN[i]}" aria-label="${CN[i]}"></button>`).join('');
$('#pal').onclick=e=>{const b=e.target.closest('button');if(!b)return;S.color=+b.dataset.c;save();render()};

/* ---- add inline ---- */
function addFrom(inp){
  const v=inp.value.trim();inp.value='';
  if(!v)return false;
  S.tasks.push({id:uid(),t:v,c:S.color,done:false,s:inp.dataset.s,k:inp.dataset.k});
  save();return true;
}
document.addEventListener('keydown',e=>{
  if(e.key==='Enter'&&e.target.classList.contains('add')){
    const s=e.target.dataset.s,k=e.target.dataset.k;
    if(addFrom(e.target)){render();const n=document.querySelector(`.add[data-s="${s}"][data-k="${k}"]`);if(n)n.focus()}
  }
});
document.addEventListener('focusout',e=>{
  if(e.target.classList&&e.target.classList.contains('add')&&e.target.value.trim()){addFrom(e.target);render()}
});

/* ---- clicks ---- */
let suppress=false;
document.addEventListener('click',e=>{
  if(suppress){e.stopPropagation();e.preventDefault();suppress=false;return}
  const t=e.target;
  const chk=t.closest('[data-chk]');
  if(chk){const k=S.tasks.find(x=>x.id===chk.dataset.chk);if(k){k.done=!k.done;save();render()}return}
  const task=t.closest('.task');
  if(task){openModal(task.dataset.id);return}
  const go=t.closest('[data-go]');
  if(go){S.cursor=go.dataset.go;S.view='week';save();render();return}
  const gm=t.closest('[data-gomonth]');
  if(gm){S.cursor=gm.dataset.gomonth+'-01';S.view='month';save();render();return}
  const nw=t.closest('[data-new]');
  if(nw){openModal(null,{s:'day',k:nw.dataset.new})}
});

/* ---- drag & drop (pressione prolungata su iPad) ---- */
let press=null,drag=null;
function endPress(){if(press){clearTimeout(press.timer);press=null}}
function startDrag(){
  if(!press)return;
  const el=press.el;
  const g=el.cloneNode(true);g.classList.add('ghost');g.style.width=el.offsetWidth+'px';
  document.body.appendChild(g);el.classList.add('dragging');
  drag={id:press.id,el,g,over:null};
  moveGhost(press.x,press.y);press=null;
}
function moveGhost(x,y){
  drag.g.style.left=(x-20)+'px';drag.g.style.top=(y-14)+'px';
  const tg=document.elementFromPoint(x,y);
  const d=tg&&tg.closest('[data-drop]');
  if(drag.over!==d){if(drag.over)drag.over.classList.remove('over');if(d)d.classList.add('over');drag.over=d}
}
document.addEventListener('pointerdown',e=>{
  const el=e.target.closest('.task');
  if(!el||e.target.closest('.chk')||(e.pointerType==='mouse'&&e.button!==0))return;
  press={el,id:el.dataset.id,x:e.clientX,y:e.clientY,x0:e.clientX,y0:e.clientY,type:e.pointerType,timer:null};
  if(e.pointerType!=='mouse')press.timer=setTimeout(startDrag,320);
});
document.addEventListener('pointermove',e=>{
  if(drag){moveGhost(e.clientX,e.clientY);return}
  if(press){
    press.x=e.clientX;press.y=e.clientY;
    if(Math.hypot(e.clientX-press.x0,e.clientY-press.y0)>8){
      if(press.type==='mouse')startDrag();else endPress();
    }
  }
});
document.addEventListener('touchmove',e=>{if(drag)e.preventDefault()},{passive:false});
function finishDrag(drop){
  if(!drag)return;
  const {id,el,g,over}=drag;drag=null;
  g.remove();el.classList.remove('dragging');if(over)over.classList.remove('over');
  suppress=true;setTimeout(()=>suppress=false,350);
  if(drop&&over){
    const i=S.tasks.findIndex(x=>x.id===id);
    if(i>=0){const t=S.tasks.splice(i,1)[0];t.s=over.dataset.s;t.k=over.dataset.k;S.tasks.push(t);save()}
  }
  render();
}
document.addEventListener('pointerup',()=>{endPress();finishDrag(true)});
document.addEventListener('pointercancel',()=>{endPress();finishDrag(false)});
document.addEventListener('contextmenu',e=>{if(e.target.closest('.task'))e.preventDefault()});

/* ---- modal ---- */
function closeModal(){const o=$('#ov');if(o)o.remove()}
function openModal(id,preset){
  closeModal();
  const t=id?{...S.tasks.find(x=>x.id===id)}:{id:null,t:'',c:S.color,done:false,...preset};
  let c=t.c,s=t.s;
  const ds=t.s==='month'?t.k+'-01':t.k;
  const o=document.createElement('div');o.className='ov';o.id='ov';
  o.innerHTML=`<div class="sheet">
    <textarea id="mt" rows="2" placeholder="Attività">${esc(t.t)}</textarea>
    <div class="colors">${COLORS.map((x,i)=>`<button style="--c:${x}" data-c="${i}" title="${CN[i]}"${i===c?' class="on"':''}></button>`).join('')}</div>
    <div class="seg" id="ms"><button data-s="day">Giorno</button><button data-s="week">Settimana</button><button data-s="month">Mese</button></div>
    <input type="date" id="md" value="${ds}">
    ${id?`<label><input type="checkbox" id="mdn"${t.done?' checked':''}> Fatto</label>`:''}
    <div class="row">${id?'<button class="btn del" id="mdel">Elimina</button>':''}<span class="sp"></span><button class="btn" id="mcan">Annulla</button><button class="btn pri" id="msave">Salva</button></div>
  </div>`;
  document.body.appendChild(o);
  const paintS=()=>o.querySelectorAll('#ms button').forEach(b=>b.classList.toggle('on',b.dataset.s===s));
  paintS();
  o.addEventListener('click',e=>{
    if(e.target===o){closeModal();return}
    const cb=e.target.closest('.colors button');
    if(cb){c=+cb.dataset.c;o.querySelectorAll('.colors button').forEach((b,i)=>b.classList.toggle('on',i===c))}
    const sb=e.target.closest('#ms button');if(sb){s=sb.dataset.s;paintS()}
  });
  o.querySelector('#mcan').onclick=closeModal;
  if(id)o.querySelector('#mdel').onclick=()=>{S.tasks=S.tasks.filter(x=>x.id!==id);save();closeModal();render()};
  o.querySelector('#msave').onclick=()=>{
    const txt=o.querySelector('#mt').value.trim();if(!txt)return;
    const dv=o.querySelector('#md').value||fmt(new Date());
    const k=keyFor(s,dv);
    if(id){
      const x=S.tasks.find(q=>q.id===id);
      const moved=x.s!==s||x.k!==k;
      Object.assign(x,{t:txt,c,s,k,done:o.querySelector('#mdn').checked});
      if(moved){S.tasks=S.tasks.filter(q=>q!==x);S.tasks.push(x)}
    }else S.tasks.push({id:uid(),t:txt,c,done:false,s,k});
    save();closeModal();render();
  };
  setTimeout(()=>{try{o.querySelector('#mt').focus()}catch(e){}},50);
}

/* ---- menu ---- */
$('#menu').onclick=()=>{
  closeModal();
  const o=document.createElement('div');o.className='ov';o.id='ov';
  o.innerHTML=`<div class="sheet menu"><button class="btn" id="bx">Esporta backup (.json)</button><button class="btn" id="bi">Importa backup</button><button class="btn del" id="bc">Elimina le attività completate</button><button class="btn" id="bk">Chiudi</button></div>`;
  document.body.appendChild(o);
  o.addEventListener('click',e=>{if(e.target===o)closeModal()});
  o.querySelector('#bk').onclick=closeModal;
  o.querySelector('#bx').onclick=()=>{
    try{const b=new Blob([JSON.stringify(S.tasks)],{type:'application/json'});const a=document.createElement('a');a.href=URL.createObjectURL(b);a.download='agenda-backup.json';a.click()}catch(e){}
    closeModal();
  };
  o.querySelector('#bi').onclick=()=>$('#file').click();
  o.querySelector('#bc').onclick=()=>{S.tasks=S.tasks.filter(t=>!t.done);save();closeModal();render()};
};
$('#file').onchange=e=>{
  const f=e.target.files[0];if(!f)return;
  const r=new FileReader();
  r.onload=()=>{try{
    const a=JSON.parse(r.result);const ids=new Set(S.tasks.map(t=>t.id));
    a.forEach(t=>{if(t&&t.id&&t.t&&!ids.has(t.id))S.tasks.push(t)});
    save();closeModal();render();
  }catch(err){}};
  r.readAsText(f);e.target.value='';
};

/* icona per "Aggiungi a Home" */
try{
  const c=document.createElement('canvas');c.width=c.height=180;const x=c.getContext('2d');
  x.fillStyle='#fff';x.fillRect(0,0,180,180);
  x.fillStyle='#ff3b30';x.fillRect(0,0,180,52);
  x.fillStyle='#1c1c1e';x.font='bold 96px -apple-system,sans-serif';x.textAlign='center';x.fillText(String(new Date().getDate()),90,150);
  const l=document.createElement('link');l.rel='apple-touch-icon';l.href=c.toDataURL('image/png');document.head.appendChild(l);
}catch(e){}

render();
</script>
</body>
</html>
